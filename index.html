<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b2a5b">
<link rel="icon" href="data:,">
<title>MathBlaster v2 – web prototype (M1.1–M1.3)</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#0b2a5b;
    overscroll-behavior:none; touch-action:none; -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; position:fixed; inset:0; }
  canvas#game { display:block; width:100vw; height:100vh; height:100dvh; touch-action:none; }
  #hud { position:fixed; top:calc(env(safe-area-inset-top) + 8px); left:calc(env(safe-area-inset-left) + 8px);
    font:600 13px/1.35 ui-monospace, Menlo, monospace; color:#cfe6ff; background:rgba(5,20,45,.65);
    border:1px solid rgba(160,200,255,.4); border-radius:6px; padding:5px 8px; white-space:pre; pointer-events:none; }
  #toggle { position:fixed; top:calc(env(safe-area-inset-top) + 8px); right:calc(env(safe-area-inset-right) + 8px);
    font:600 13px ui-monospace, Menlo, monospace; color:#cfe6ff; background:rgba(5,20,45,.65);
    border:1px solid rgba(160,200,255,.4); border-radius:6px; padding:6px 10px; touch-action:manipulation; }
  #hint { position:fixed; bottom:calc(env(safe-area-inset-bottom) + 18px); left:0; right:0; text-align:center;
    font:600 15px system-ui, sans-serif; color:rgba(207,230,255,.75); pointer-events:none; transition:opacity .6s; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div>
<button id="toggle" type="button">FPS</button>
<div id="hint">Drag left / right anywhere to steer</div>
<script type="module" src="./main.js"></script>
</body>
</html>
