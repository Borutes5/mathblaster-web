<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b2a5b">
<link rel="icon" href="data:,">
<title>MathBlaster v2 – web prototype (M1.1–M1.4)</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#0b2a5b;
    overscroll-behavior:none; -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; position:fixed; inset:0; }
  canvas#game { display:block; width:100vw; height:100vh; height:100dvh; touch-action:none; }
  #hud { position:fixed; top:calc(env(safe-area-inset-top) + 8px); left:calc(env(safe-area-inset-left) + 8px);
    max-width:min(280px, calc(100vw - 130px));
    font:600 13px/1.35 ui-monospace, Menlo, monospace; color:#cfe6ff; background:rgba(5,20,45,.65);
    border:1px solid rgba(160,200,255,.4); border-radius:6px; padding:5px 8px; white-space:pre-wrap; pointer-events:none; z-index:2; }
  #actions { position:fixed; top:calc(env(safe-area-inset-top) + 8px); right:calc(env(safe-area-inset-right) + 8px);
    display:flex; gap:6px; z-index:4; touch-action:manipulation; }
  #actions button { font:600 13px ui-monospace, Menlo, monospace; color:#cfe6ff; background:rgba(5,20,45,.65);
    border:1px solid rgba(160,200,255,.4); border-radius:6px; padding:6px 10px; touch-action:manipulation; }
  #tune-panel { position:fixed; top:calc(env(safe-area-inset-top) + 112px); right:calc(env(safe-area-inset-right) + 8px);
    width:min(268px, calc(100vw - 16px)); max-height:min(68vh, 520px); overflow:auto; z-index:3; box-sizing:border-box;
    font:600 12px/1.3 ui-monospace, Menlo, monospace; color:#cfe6ff; background:rgba(5,20,45,.72);
    border:1px solid rgba(160,200,255,.4); border-radius:8px; padding:6px 8px 8px; touch-action:manipulation; }
  #tune-panel[hidden] { display:none; }
  #tune-panel label { display:block; margin:0 0 6px; touch-action:manipulation; }
  #tune-panel output { float:right; font-variant-numeric:tabular-nums; }
  #tune-panel input[type=range] { display:block; width:100%; margin:5px 0 0; height:28px; touch-action:pan-x; accent-color:#9fd0ff; }
  #tune-foot { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:2px; }
  #tune-panel .tune-check { display:flex; align-items:center; gap:8px; margin:0; }
  #tune-panel .tune-check input { width:18px; height:18px; margin:0; touch-action:manipulation; }
  #tune-reset, #reset-hits { font:600 12px ui-monospace, Menlo, monospace; color:#cfe6ff; background:rgba(5,20,45,.65);
    border:1px solid rgba(160,200,255,.4); border-radius:6px; padding:6px 10px; touch-action:manipulation; }
  #reset-hits { display:block; width:100%; margin-top:6px; }
  #audio-state { margin-top:6px; font:600 11px/1.3 ui-monospace, Menlo, monospace; color:rgba(207,230,255,.8); }
  #safe-bottom { position:fixed; left:0; bottom:0; width:0; height:env(safe-area-inset-bottom); pointer-events:none; visibility:hidden; }
  #banner { position:fixed; left:50%; top:46%; transform:translate(-50%,-50%); z-index:6;
    max-width:min(320px, calc(100vw - 32px)); text-align:center;
    font:700 20px/1.35 system-ui, sans-serif; color:#fff; background:rgba(5,20,45,.82);
    border:1px solid rgba(160,200,255,.55); border-radius:10px; padding:14px 16px; touch-action:manipulation; }
  #banner[hidden] { display:none; }
  #level-toast { position:fixed; left:50%; bottom:32%; transform:translateX(-50%); z-index:5;
    pointer-events:none; font:900 28px/1 system-ui, sans-serif; color:#fff; letter-spacing:0.04em;
    text-shadow: -2px -2px 0 #061018, 2px -2px 0 #061018, -2px 2px 0 #061018, 2px 2px 0 #061018, 0 3px 0 #061018; }
  #level-toast[hidden] { display:none; }
  #banner.over { pointer-events:auto; }
  #banner.clear { pointer-events:none; }
  #hint { position:fixed; bottom:calc(env(safe-area-inset-bottom) + 18px); left:0; right:0; text-align:center;
    font:600 15px system-ui, sans-serif; color:rgba(207,230,255,.75); pointer-events:none; transition:opacity .6s; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">v0.13.1</div>
<div id="actions">
  <button id="tune" type="button" aria-expanded="false" aria-controls="tune-panel">TUNE</button>
  <button id="toggle" type="button">FPS</button>
</div>
<div id="tune-panel" hidden>
  <label>Sensitivity <output id="out-sensitivity">11</output>
    <input id="in-sensitivity" type="range" min="6" max="16" step="0.5" value="11">
  </label>
  <label>Smoothing (lower = more glide) <output id="out-smoothK">30</output>
    <input id="in-smoothK" type="range" min="5" max="60" step="1" value="30">
  </label>
  <label>Edge clamp <output id="out-clampX">3.5</output>
    <input id="in-clampX" type="range" min="2.5" max="3.5" step="0.1" value="3.5">
  </label>
  <label>Base speed <output id="out-espeed">4.0</output>
    <input id="in-espeed" type="range" min="0.5" max="8" step="0.1" value="4">
  </label>
  <label>Speed ramp <output id="out-ramp">0.10</output>
    <input id="in-ramp" type="range" min="0" max="1" step="0.05" value="0.10">
  </label>
  <label>Hits to break <output id="out-phits">20</output>
    <input id="in-phits" type="range" min="5" max="40" step="1" value="20">
  </label>
  <label>-1 weight <output id="out-wneg">35</output>
    <input id="in-wneg" type="range" min="0" max="100" step="1" value="35">
  </label>
  <label>÷2 weight <output id="out-wdiv">25</output>
    <input id="in-wdiv" type="range" min="0" max="100" step="1" value="25">
  </label>
  <label>+1 weight <output id="out-wplus">25</output>
    <input id="in-wplus" type="range" min="0" max="100" step="1" value="25">
  </label>
  <label>x2 weight <output id="out-wmul">15</output>
    <input id="in-wmul" type="range" min="0" max="100" step="1" value="15">
  </label>
  <div id="tune-foot">
    <label class="tune-check"><input id="in-touchSmooth" type="checkbox"> Touch smoothing</label>
    <button id="tune-reset" type="button">Reset</button>
  </div>
  <label class="tune-check"><input id="in-gateFx" type="checkbox" checked> Gate FX</label>
  <label class="tune-check"><input id="in-marker" type="checkbox"> Marker</label>
  <label class="tune-check"><input id="in-m2" type="checkbox"> M2 gates</label>
  <label class="tune-check"><input id="in-v09" type="checkbox" checked> v0.9 enemies</label>
  <label class="tune-check"><input id="in-hpnum" type="checkbox"> HP numbers</label>
  <label class="tune-check"><input id="in-sound" type="checkbox" checked> Sound</label>
  <label>Start level <output id="out-slevel">1</output>
    <input id="in-slevel" type="range" min="1" max="3" step="1" value="1">
  </label>
  <button id="reset-hits" type="button">Reset hits</button>
  <div id="audio-state">Audio: none</div>
</div>
<div id="safe-bottom" aria-hidden="true"></div>
<div id="banner" hidden></div>
<div id="level-toast" hidden></div>
<div id="hint">Drag left / right anywhere to steer</div>
<script type="module" src="./main.js"></script>
</body>
</html>
